<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a22" />
  <title>pixel art sandbox</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1a1a22;
      color: #c8c8d0;
      font-family: ui-monospace, "Cascadia Mono", Menlo, monospace;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      height: 100dvh;
      padding-top: 12px;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      box-shadow: 0 0 0 2px #2a2a36, 0 12px 48px #0008;
    }
    #hint {
      font-size: 11px;
      opacity: .55;
      text-align: center;
      padding: 0 8px;
    }
    #hint kbd {
      background: #2a2a36;
      border-radius: 3px;
      padding: 1px 5px;
      border: 1px solid #3a3a48;
    }

    /* Touch controls */
    .pad {
      position: fixed;
      pointer-events: none;
      /* lifted enough to clear Android Chrome bottom URL bar */
      bottom: max(80px, calc(env(safe-area-inset-bottom) + 64px));
    }
    .pad.left {
      left: 16px;
      display: grid;
      grid-template-columns: 56px 56px 56px;
      grid-template-rows: 56px 56px 56px;
      gap: 4px;
      width: 172px;
      height: 172px;
    }
    .pad.right {
      right: 20px;
    }
    .btn {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: rgba(40, 42, 56, 0.65);
      border: 2px solid rgba(120, 130, 160, 0.55);
      color: #d8dae6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      pointer-events: auto;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: transform 60ms, background 60ms;
      box-shadow: 0 4px 10px #0008;
    }
    .btn.active {
      background: rgba(80, 200, 140, 0.55);
      transform: scale(0.94);
    }
    .pad.left [data-input="up"]    { grid-column: 2; grid-row: 1; }
    .pad.left [data-input="left"]  { grid-column: 1; grid-row: 2; }
    .pad.left [data-input="right"] { grid-column: 3; grid-row: 2; }
    .pad.left [data-input="down"]  { grid-column: 2; grid-row: 3; }

    .pad.right [data-input="attack"] {
      width: 76px; height: 76px;
      background: rgba(200, 90, 90, 0.55);
      border-color: rgba(240, 140, 140, 0.65);
      font-size: 14px;
    }
    .pad.right [data-input="attack"].active {
      background: rgba(240, 140, 140, 0.85);
    }

    @media (hover: hover) and (pointer: fine) {
      .pad { opacity: 0.35; }
    }
  </style>
</head>
<body>
  <canvas id="screen"></canvas>
  <div id="hint">
    <kbd>WASD</kbd>/<kbd>setas</kbd> mover &nbsp;·&nbsp;
    <kbd>espaço</kbd> ataque &nbsp;·&nbsp;
    <kbd>F1</kbd> debug &nbsp;·&nbsp;
    <kbd>F2</kbd> recarregar nível
  </div>

  <div class="pad left">
    <div class="btn" data-input="up">▲</div>
    <div class="btn" data-input="left">◀</div>
    <div class="btn" data-input="right">▶</div>
    <div class="btn" data-input="down">▼</div>
  </div>
  <div class="pad right">
    <div class="btn" data-input="attack">ATK</div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
