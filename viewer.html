<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mage Animation Viewer</title>
<style>
  html, body {
    margin: 0;
    background: #0c0e16;
    color: #cfd3e0;
    font: 14px ui-monospace, SFMono-Regular, Menlo, monospace;
    min-height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 14px;
  }
  h1 { font-size: 14px; font-weight: 600; margin: 0; color: #fff; }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #1c2030;
    box-shadow: 0 0 40px rgba(0,0,0,.5);
  }
  .panel {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    align-items: center;
    background: #161a26;
    padding: 10px 14px;
    border-radius: 6px;
    border: 1px solid #232838;
  }
  .group { display: flex; gap: 6px; align-items: center; }
  .label {
    color: #7c8294;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-right: 4px;
  }
  button {
    background: #232838;
    color: #cfd3e0;
    border: 1px solid #2d3349;
    padding: 5px 10px;
    border-radius: 4px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #2d3349; }
  button.active {
    background: #3b6cb5;
    border-color: #5a8be0;
    color: #fff;
  }
  a { color: #7fbfff; font-size: 12px; }
  .pill {
    background: #232838;
    padding: 4px 10px;
    border-radius: 999px;
    color: #fde36a;
    font-size: 12px;
  }
</style>
</head>
<body>
  <h1>mage animation viewer</h1>
  <canvas id="screen"></canvas>

  <div class="panel">
    <div class="group">
      <span class="label">Action</span>
      <button data-mode="breath">Breath</button>
      <button data-mode="walk">Walk</button>
      <button data-mode="melee">Melee</button>
      <button data-mode="magic">Magic</button>
      <button data-mode="death">Death</button>
    </div>
    <div class="group">
      <span class="label">Facing</span>
      <button data-dir="down">&darr;</button>
      <button data-dir="left">&larr;</button>
      <button data-dir="right">&rarr;</button>
      <button data-dir="up">&uarr;</button>
    </div>
    <div class="group">
      <span class="label">Speed</span>
      <button data-speed="0.1">10%</button>
      <button data-speed="0.25">25%</button>
      <button data-speed="0.5">50%</button>
      <button data-speed="1">100%</button>
    </div>
    <div class="group">
      <span class="label">Phase</span>
      <span class="pill" id="phase">&mdash;</span>
    </div>
  </div>

  <a href="index.html">&larr; back to game</a>
  <script type="module" src="src/viewer.js"></script>
</body>
</html>
